{% extends "base.html" %}
{% block title %}登录 · 羊城杯 mock{% endblock %}
{% block content %}
<section class="hero">
  <h1>{{ competition_title }}</h1>
  <p class="muted">比赛阶段：CTF 夺旗赛 · mock 环境</p>
</section>

<div class="card login-card">
  <h2>登录</h2>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post" action="/1749/login">
    <input type="hidden" name="captcha_id" value="{{ captcha_id }}">
    <label>账号/手机号
      <input name="username" autocomplete="username" placeholder="请输入您的账号/手机号" required>
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="current-password" placeholder="请输入您的密码" required>
    </label>
    <label>图形验证码
      <span class="captcha-row">
        <input name="captcha" placeholder="请输入图形验证码" autocomplete="off" required>
        <img src="/captcha/{{ captcha_id }}.png" alt="图形验证码">
      </span>
    </label>
    <button class="primary" type="submit">立即登录</button>
  </form>
  <p class="muted small">mock 账号：<code>player</code> / <code>mock-pass-2026</code>（可用 MOCK_USERNAME / MOCK_PASSWORD 覆盖）</p>
</div>
{% endblock %}
