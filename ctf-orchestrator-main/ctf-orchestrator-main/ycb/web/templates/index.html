<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTF 解题编排看板（2026 羊城杯）</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">CTF</span>
      <div class="brand-text">
        <h1>解题编排看板</h1>
        <p>{{ competition_title }} · 企业组</p>
      </div>
    </div>
    <div class="top-meta">
      <div class="countdown">
        <span class="label" id="countdown-label">距开赛</span>
        <strong id="countdown-value">--:--:--</strong>
      </div>
      <div class="state-badge" id="session-badge" title="平台登录会话">
        <span class="dot" id="session-dot"></span><span id="session-text">会话未知</span>
      </div>
      <div class="state-badge" id="conn-badge" title="看板 WebSocket">
        <span class="dot" id="conn-dot"></span><span id="conn-text">连接中</span>
      </div>
      <span class="badge warn hidden" id="dryrun-badge">DRY RUN</span>
    </div>
  </header>

  <section class="stats" id="stats">
    <div class="stat"><span class="stat-label">题目</span><strong id="stat-total">0</strong></div>
    <div class="stat"><span class="stat-label">运行中</span><strong id="stat-running">0</strong></div>
    <div class="stat"><span class="stat-label">已解</span><strong id="stat-solved">0</strong></div>
    <div class="stat"><span class="stat-label">已提交</span><strong id="stat-submitted">0</strong></div>
    <div class="stat"><span class="stat-label">需关注</span><strong id="stat-attention">0</strong></div>
    <div class="stat"><span class="stat-label">失败</span><strong id="stat-failed">0</strong></div>
    <div class="stat"><span class="stat-label">自动提交</span><strong id="stat-submits">0/0</strong></div>
    <div class="stat"><span class="stat-label">发现</span><strong class="small-strong" id="stat-discovery">空闲</strong></div>
  </section>

  <main class="workspace">

    <section class="panel list-panel">
      <header class="panel-head">
        <h2>题目 <span class="muted" id="list-count">0</span></h2>
        <div class="filters" id="filters">
          <button class="filter active" data-filter="all" type="button">全部</button>
          <button class="filter" data-filter="running" type="button">进行中</button>
          <button class="filter" data-filter="attention" type="button">需关注</button>
          <button class="filter" data-filter="failed" type="button">失败</button>
          <button class="filter" data-filter="solved" type="button">已解</button>
        </div>
      </header>
      <div class="challenge-list" id="challenge-list" role="list">
        <div class="empty">等待发现题目…</div>
      </div>
    </section>

    <section class="panel timeline-panel">
      <header class="panel-head">
        <h2>事件时间线 <span class="muted" id="timeline-scope">全部题目</span></h2>
        <div class="timeline-tools">
          <button class="ghost hidden" id="btn-scope-all" type="button">看全部</button>
          <label class="check"><input type="checkbox" id="follow" checked> 跟随</label>
          <button class="ghost" id="btn-clear-events" type="button">清空</button>
        </div>
      </header>
      <div class="timeline" id="timeline">
        <div class="empty">连接后显示实时事件…</div>
      </div>
    </section>

    <aside class="panel detail-panel">
      <header class="panel-head">
        <h2>题目详情</h2>
        <span class="muted" id="detail-status"></span>
      </header>
      <div class="detail-body" id="detail">
        <div class="empty">从左侧选择一道题…</div>
      </div>
    </aside>

  </main>

  <footer class="actionbar">
    <div class="msg-box">
      <input id="message-input" placeholder="向 Agent 发送消息（Agent 未运行时将作为首条消息启动它）" autocomplete="off" maxlength="4000">
      <button id="btn-send" class="primary" type="button">发送</button>
    </div>
    <div class="actions">
      <button id="btn-pause" type="button" disabled>暂停</button>
      <button id="btn-stop" type="button" disabled>停止</button>
      <button id="btn-resume" type="button" disabled>重开 resume</button>
      <button id="btn-fresh" type="button" disabled>重开 fresh</button>
      <button id="btn-submit" type="button" disabled>手动提交</button>
      <button id="btn-stop-all" class="danger" type="button">全部停止</button>
    </div>
  </footer>

</div>

<div class="toast hidden" id="toast" role="status"></div>

<div class="modal hidden" id="submit-modal">
  <div class="modal-card">
    <h3>手动提交 Flag</h3>
    <p class="muted" id="submit-modal-title">选择题目后提交单个 flag（dry_run 模式下只记录，不会真正提交）</p>
    <input id="submit-flag-input" placeholder="DASCTF{...}" autocomplete="off">
    <div class="modal-actions">
      <button id="submit-cancel" type="button">取消</button>
      <button id="submit-confirm" class="primary" type="button">提交</button>
    </div>
  </div>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
